<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#000510"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="member1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="member2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="member3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="member4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="18"/>

  <!-- Stars -->
  <g opacity="0.9">
    <!-- Row 1 stars -->
    <circle cx="45" cy="20" r="1.2" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="55" r="0.8" fill="white"><animate attributeName="opacity" values="1;0.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="30" r="1.5" fill="#a78bfa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="15" r="1.0" fill="white"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="45" r="0.7" fill="#60a5fa"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.3" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="10" r="0.9" fill="#34d399"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="1.1" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="30" r="0.8" fill="#fbbf24"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1.4" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" repeatCount="indefinite"/></circle>
    <!-- Row 2 stars -->
    <circle cx="80" cy="280" r="1.0" fill="white"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="295" r="0.7" fill="#a78bfa"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="305" r="1.3" fill="white"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="290" r="0.9" fill="#60a5fa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="310" r="1.1" fill="white"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="285" r="0.8" fill="#34d399"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="300" r="1.2" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="270" r="0.6" fill="#fbbf24"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <!-- Scattered -->
    <circle cx="30" cy="150" r="0.8" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="160" r="1.0" fill="white"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="15" cy="90" r="1.2" fill="#a78bfa"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="885" cy="240" r="0.7" fill="#60a5fa"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Orbit ring decoration -->
  <ellipse cx="450" cy="160" rx="400" ry="130" fill="none" stroke="#a78bfa" stroke-width="0.4" stroke-dasharray="6 10" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" from="0 450 160" to="360 450 160" dur="30s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="160" rx="330" ry="100" fill="none" stroke="#60a5fa" stroke-width="0.3" stroke-dasharray="4 14" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="360 450 160" to="0 450 160" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Title: TEAM -->
  <text x="450" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="10" fill="#60a5fa" opacity="0.7">
    ✦ NASA SPACE APPS CHALLENGE 2026 ✦
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Title: OUR TEAM -->
  <text x="450" y="108" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="32" font-weight="900" letter-spacing="6" fill="url(#titleGrad)" filter="url(#textGlow)">
    👨‍🚀 OUR TEAM 👩‍🚀
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Divider line animated -->
  <line x1="150" y1="122" x2="750" y2="122" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="x1" values="450;150" dur="1s" fill="freeze"/>
    <animate attributeName="x2" values="450;750" dur="1s" fill="freeze"/>
  </line>

  <!-- Member 1: Fabiya -->
  <g opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,20;0,0" begin="0.4s" dur="0.6s" fill="freeze"/>
    <text x="130" y="178" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#f472b6" letter-spacing="3">★ 01</text>
    <text x="230" y="178" text-anchor="start" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#member1Grad)">Fabiya</text>
  </g>

  <!-- Member 2: Mayesha -->
  <g opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,20;0,0" begin="0.9s" dur="0.6s" fill="freeze"/>
    <text x="560" y="178" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#60a5fa" letter-spacing="3">★ 02</text>
    <text x="610" y="178" text-anchor="start" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#member2Grad)">Mayesha</text>
  </g>

  <!-- Member 3: Razty -->
  <g opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,20;0,0" begin="1.4s" dur="0.6s" fill="freeze"/>
    <text x="130" y="245" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#fbbf24" letter-spacing="3">★ 03</text>
    <text x="230" y="245" text-anchor="start" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#member3Grad)">Razty</text>
  </g>

  <!-- Member 4: Araf -->
  <g opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,20;0,0" begin="1.9s" dur="0.6s" fill="freeze"/>
    <text x="560" y="245" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#34d399" letter-spacing="3">★ 04</text>
    <text x="610" y="245" text-anchor="start" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#member4Grad)">Araf</text>
  </g>

  <!-- Vertical separator -->
  <line x1="450" y1="145" x2="450" y2="265" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <!-- Bottom tagline -->
  <text x="450" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8" letter-spacing="2" opacity="0">
    🚀  Exploring the cosmos together  🌌
    <animate attributeName="opacity" values="0;0.7" begin="2.5s" dur="1s" fill="freeze"/>
  </text>

  <!-- Shooting star animation -->
  <circle cx="-10" cy="80" r="1.5" fill="white" opacity="0.9">
    <animate attributeName="cx" values="-10;950" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;180" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <line x1="-10" y1="80" x2="-40" y2="70" stroke="white" stroke-width="0.8" opacity="0.4">
    <animate attributeName="x1" values="-10;950" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="80;180" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-40;920" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="70;170" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </line>

  <!-- Second shooting star -->
  <circle cx="-10" cy="200" r="1.2" fill="#a78bfa" opacity="0.9">
    <animate attributeName="cx" values="-10;950" dur="3.2s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;100" dur="3.2s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Border glow -->
  <rect width="900" height="320" fill="none" rx="18" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
